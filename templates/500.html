{% extends "base.html" %}

{% block title %}500 Internal Error - Crime Data Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5 text-center">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-warning">500</h1>
        <h3 class="fw-bold text-dark mb-3">Internal System Exception</h3>
        <p class="text-muted mb-4">An unexpected server processing error occurred. Please try again or contact the administrator.</p>
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-primary px-4 fw-bold">
            <i class="fa-solid fa-house me-2"></i> Return to Home Page
        </a>
    </div>
</div>
{% endblock %}
