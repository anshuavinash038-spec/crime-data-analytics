{% extends "base.html" %}

{% block title %}Forgot Password - Crime Data Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-dark text-white text-center py-4 border-0">
                <i class="fa-solid fa-unlock-keyhole fs-1 text-warning mb-2"></i>
                <h4 class="fw-bold mb-0">Reset Password</h4>
                <small class="text-muted">Enter your email to receive a reset link</small>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">Registered Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold shadow-sm mb-3">
                        <i class="fa-solid fa-paper-plane me-2"></i> Send Reset Link
                    </button>
                    
                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none small fw-bold">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
