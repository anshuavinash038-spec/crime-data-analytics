{% extends "base.html" %}

{% block title %}Set New Password - Crime Data Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-dark text-white text-center py-4 border-0">
                <i class="fa-solid fa-key fs-1 text-success mb-2"></i>
                <h4 class="fw-bold mb-0">Set New Password</h4>
                <small class="text-muted">Choose a new, secure password</small>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required minlength="6">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-bold">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3">
                        <i class="fa-solid fa-check-circle me-2"></i> Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
